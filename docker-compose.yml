services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "10000:10000"
    environment:
      # Inside the container the health server must listen on this mapped port.
      PORT: "10000"
      DATA_DIR: /tmp/formbot-data
    volumes:
      - formbot-data:/tmp/formbot-data

volumes:
  formbot-data:
