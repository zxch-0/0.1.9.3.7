[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # discord.py imports the stdlib audioop module for voice support we never use.
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"] # ambiguous-unicode is expected: this bot is emoji-first

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011"]
